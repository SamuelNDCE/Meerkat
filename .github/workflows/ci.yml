name: CI

on:
  push:
    branches: [main, ci-crossplatform]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The self-run reads git history (large commits, secrets in history); a depth-1 checkout would make the one commit look like it added every file.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --maxWorkers=2
      - run: node run.mjs --app . --preset quick --plain

  # A dedicated Linux job (0.5.3), so a Linux-only failure (case-sensitive paths, POSIX shell quoting, file modes) shows up as its own red line.
  # The test job above also runs on ubuntu-latest; this one runs only the test command and is the named required check for Linux.
  linux:
    name: linux (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --maxWorkers=2

  # The pre-release checks on every change, so a release day holds no surprise: changelog, tarball file list, npm audit (high), secret scan,
  # fix commits without a test (a warning), and the tarball install test. See docs/release.md.
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the fix-needs-a-test step reads the history since the last tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/release/gate.mjs --smoke
