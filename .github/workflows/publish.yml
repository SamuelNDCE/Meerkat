# Publishes the package to npm when a GitHub release is published, with npm trusted publishing: no npm token is stored anywhere.
# One-time setup on npmjs.com (package @samuelndce/meerkat, Settings, Trusted Publisher, GitHub Actions): user SamuelNDCE,
# repository Meerkat, workflow filename publish.yml, and allow direct publish (npm publish).
name: Publish to npm
on:
  release:
    types: [published]
# Two releases never publish at the same time, and a running publish is never cancelled half way.
concurrency:
  group: publish-npm
  cancel-in-progress: false
permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release gate reads the history since the last tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in a release build
      - name: The release tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci --ignore-scripts
      # Changelog, tarball file list, npm audit (high), secret scan, fix commits without a test, and the tarball install test. A step that fails or cannot run stops the publish.
      - name: Release gate
        run: node tools/release/gate.mjs --smoke
      - run: npm publish
